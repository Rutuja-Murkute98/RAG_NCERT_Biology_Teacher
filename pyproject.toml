[project]
name = "rag-ncert-biology-teacher"
version = "0.1.0"
description = "RAG-based NCERT Class 12 Biology teacher chatbot - Gemini/Vertex AI, Chroma, Flask"
authors = [
    { name = "Rutuja Sudam Murkute", email = "rutujamurkute98@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.1.4",
    "flask>=3.1.3",
    "google-cloud-storage>=2.18.0",
    "google-genai>=2.17.0",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"
